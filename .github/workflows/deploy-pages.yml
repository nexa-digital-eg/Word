# نشر تطبيق الويب على GitHub Pages تلقائياً عند كل تحديث
# يدفع محتويات web/ إلى برانش gh-pages الذي تُقدَّم منه الصفحة.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["claude/pdf-word-arabic-converter-4sacdn", "main"]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy web/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "نشر تلقائي من ${{ github.sha }}"
