[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-word-arabic"
version = "1.0.0"
description = "محول PDF إلى Word مع دعم كامل للعربية بجميع الخطوط"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "python-docx>=1.1",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[project.scripts]
pdf2word = "pdf_to_word.cli:main"
pdf2word-gui = "pdf_to_word.gui:main"

[tool.setuptools.packages.find]
include = ["pdf_to_word*"]
