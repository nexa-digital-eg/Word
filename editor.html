<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محرّر PDF — تعديل بنفس الشكل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri&family=Tajawal:wght@400;500;700&family=Markazi+Text&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="editor.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>" />
</head>
<body class="editor-body">
  <header class="ed-topbar">
    <div class="ed-brand">✏️ محرّر PDF</div>
    <div class="ed-actions">
      <a class="ed-link" href="index.html">⬅ المحوّل إلى Word</a>
    </div>
  </header>

  <!-- شاشة فتح الملف -->
  <section id="openScreen" class="ed-open">
    <div id="openZone" class="ed-openzone" tabindex="0">
      <div class="dz-icon">📂</div>
      <div class="dz-title">اسحب ملف PDF هنا أو اضغط للاختيار</div>
      <div class="dz-hint">يفتح ملفك بنفس شكله بالظبط لتعديله</div>
      <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden />
    </div>
  </section>

  <!-- محرّر -->
  <div id="workspace" class="ed-workspace hidden">
    <!-- شريط الأدوات -->
    <aside class="ed-toolbar">
      <button class="tool active" data-tool="select" title="تحديد وتحريك">🖱️<span>تحديد</span></button>
      <button class="tool" data-tool="text" title="إضافة نص">🔤<span>نص</span></button>
      <button class="tool" data-tool="erase" title="مسح / تغطية">⬜<span>مسح</span></button>
      <button class="tool" data-tool="highlight" title="تظليل">🖊️<span>تظليل</span></button>
      <div class="tool-sep"></div>
      <button id="deleteBtn" class="tool" title="حذف المحدد (Delete)">🗑️<span>حذف</span></button>
      <button id="undoBtn" class="tool" title="تراجع (Ctrl+Z)">↩️<span>تراجع</span></button>
      <div class="tool-sep"></div>
      <button id="saveBtn" class="tool tool-save" title="حفظ PDF">💾<span>حفظ</span></button>
    </aside>

    <!-- خصائص العنصر -->
    <div id="propsBar" class="ed-props hidden">
      <label>الخط
        <select id="fontFamily">
          <option value="Tajawal">Tajawal</option>
          <option value="Cairo">Cairo</option>
          <option value="Amiri">Amiri (نسخ)</option>
          <option value="Markazi Text">Markazi</option>
          <option value="Arial">Arial</option>
        </select>
      </label>
      <label>الحجم
        <input type="number" id="fontSize" min="6" max="200" value="18" />
      </label>
      <label>اللون
        <input type="color" id="textColor" value="#000000" />
      </label>
      <label class="chk"><input type="checkbox" id="boldChk" /> عريض</label>
      <span id="eraseColorWrap" class="hidden">لون التغطية
        <input type="color" id="eraseColor" value="#ffffff" />
      </span>
    </div>

    <!-- منطقة الصفحات -->
    <main id="pagesArea" class="ed-pages"></main>
  </div>

  <!-- مؤشر الحفظ -->
  <div id="overlayMsg" class="ed-overlaymsg hidden"><div class="spinner"></div><span id="overlayText">جارٍ المعالجة…</span></div>

  <script src="loader-editor.js"></script>
</body>
</html>
